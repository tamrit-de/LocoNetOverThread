name: Publish firmware release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  ESP_IDF_VERSION: v5.3.2
  LNOT_FIRMWARE_VERSION: ${{ github.ref_name }}

jobs:
  test:
    name: Validate release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests
        run: python3 tests/run_host_tests.py
      - name: Run deployment-tool tests
        run: python3 tests/test_deploy_hardware.py
      - name: Run release-packaging tests
        run: python3 tests/test_package_release.py
      - name: Run WebUI tests
        run: npm test --prefix web-flasher

  build:
    name: Build release ${{ matrix.application }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: client
            target: esp32h2
          - application: border-router
            target: esp32c6
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ matrix.target }}
          path: apps/${{ matrix.application }}
      - name: Package release images
        run: |
          python3 scripts/package_release.py \
            --tag "$GITHUB_REF_NAME" \
            --application "${{ matrix.application }}" \
            --build-directory "apps/${{ matrix.application }}/build" \
            --package-directory release-package
      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware-${{ matrix.application }}
          path: release-package/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifests and firmware assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-firmware-*
          path: release-assets
          merge-multiple: true
      - name: Combine manifests
        run: |
          python3 scripts/package_release.py \
            --tag "$GITHUB_REF_NAME" \
            --package-directory release-assets \
            --combine
      - name: Upload versioned assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
