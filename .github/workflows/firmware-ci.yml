name: Firmware CI and hardware deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Physical device to flash
        required: true
        type: choice
        options:
          - client
          - border-router

permissions:
  contents: read

env:
  ESP_IDF_VERSION: v5.3.2

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run common-component tests
        run: python3 tests/run_host_tests.py
      - name: Run deployment-tool tests
        run: python3 tests/test_deploy_hardware.py

  build:
    name: Build ${{ matrix.application }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: client
            target: esp32h2
          - application: border-router
            target: esp32c6
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ matrix.target }}
          path: apps/${{ matrix.application }}
      - name: Upload firmware build
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.application }}-${{ matrix.target }}
          path: |
            apps/${{ matrix.application }}/build/
            apps/${{ matrix.application }}/sdkconfig
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy ${{ inputs.target }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - host-tests
      - build
    timeout-minutes: 10
    runs-on:
      - self-hosted
      - "lnot-${{ inputs.target }}"
    environment:
      name: hardware-${{ inputs.target }}
    concurrency:
      group: hardware-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download selected firmware build
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ inputs.target }}-${{ inputs.target == 'client' && 'esp32h2' || 'esp32c6' }}
          path: apps/${{ inputs.target }}
      - name: Verify native ESP-IDF runner
        shell: bash
        env:
          LNOT_DEVICE: /dev/lnot-board
        run: |
          set -euo pipefail
          test -n "${IDF_PATH:-}" || {
            echo "::error::IDF_PATH is not configured on this hardware runner."
            exit 1
          }
          test -f "$IDF_PATH/export.sh" || {
            echo "::error::ESP-IDF export script not found at $IDF_PATH/export.sh."
            exit 1
          }
          test -c "$LNOT_DEVICE" || {
            echo "::error::Expected the assigned board at $LNOT_DEVICE."
            echo "::error::Configure the Proxmox USB passthrough and LXC device alias first."
            exit 1
          }
          printf 'Using assigned board: %s -> %s\n' \
            "$LNOT_DEVICE" "$(readlink -f "$LNOT_DEVICE")"
          source "$IDF_PATH/export.sh"
          idf.py --version
          python3 -c 'import serial' || {
            echo "::error::pyserial is missing from the native ESP-IDF environment."
            exit 1
          }
      - name: Flash and verify selected device
        shell: bash
        env:
          LNOT_DEVICE: /dev/lnot-board
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          python3 scripts/deploy_hardware.py \
            --application "${{ inputs.target }}" \
            --port "$LNOT_DEVICE" \
            --timeout-seconds 120
