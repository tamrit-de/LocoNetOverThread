name: Firmware CI and hardware deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run common-component tests
        run: python3 tests/run_host_tests.py

  build:
    name: Build ${{ matrix.application }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: client
            target: esp32h2
          - application: border-router
            target: esp32c6
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: ${{ matrix.target }}
          path: apps/${{ matrix.application }}
      - name: Upload firmware build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firmware-${{ matrix.application }}-${{ matrix.target }}
          path: |
            apps/${{ matrix.application }}/build/
            apps/${{ matrix.application }}/sdkconfig
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy ${{ matrix.application }} (${{ matrix.target }})
    needs: [host-tests, build]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    environment:
      name: hardware-${{ matrix.application }}
    concurrency:
      group: hardware-${{ matrix.application }}
      cancel-in-progress: false
    env:
      ESPPORT: /dev/lnot-board
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: client
            target: esp32h2
            runner: ESP32-H2
            verify: "client firmware is running"
          - application: border-router
            target: esp32c6
            runner: ESP32-C6
            verify: "Border Router ready; AP SSID:"
    steps:
      - uses: actions/checkout@v4
      - name: Download firmware build
        uses: actions/download-artifact@v8.0.1
        with:
          name: firmware-${{ matrix.application }}-${{ matrix.target }}
          path: apps/${{ matrix.application }}
      - name: Verify assigned serial adapter
        shell: bash
        run: |
          set -euo pipefail
          if ! test -c "$ESPPORT"; then
            echo "::error::Serial device $ESPPORT is unavailable. Check the LXC USB bind mount and restart the container after reconnecting the board."
            exit 1
          fi
          echo "Using serial device: $ESPPORT"
      - name: Install Docker when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            sudo --non-interactive apt-get update
            sudo --non-interactive apt-get install --yes docker.io
          fi
          sudo --non-interactive systemctl enable --now docker
          sudo --non-interactive docker version
      - name: Flash and verify firmware
        shell: bash
        run: |
          set -euo pipefail
          sudo --non-interactive docker run --rm --tty \
            --device="$ESPPORT" \
            --env "ESPPORT=$ESPPORT" \
            --env "IDF_TARGET=${{ matrix.target }}" \
            --volume "$GITHUB_WORKSPACE:/app/$GITHUB_REPOSITORY" \
            --workdir "/app/$GITHUB_REPOSITORY/apps/${{ matrix.application }}" \
            espressif/idf:v5.3.2 \
            /bin/bash -c '
            git config --global --add safe.directory "*"
            status=0
            timeout --signal=INT --kill-after=5s 120s idf.py flash monitor > /tmp/lnot-deploy-monitor.log 2>&1 || status=$?
            cat /tmp/lnot-deploy-monitor.log
            test "$status" -eq 124
            grep -Fq "${{ matrix.verify }}" /tmp/lnot-deploy-monitor.log
            '
