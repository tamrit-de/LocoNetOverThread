name: Firmware CI and hardware deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Physical device to flash
        required: true
        type: choice
        options:
          - client
          - border-router

permissions:
  contents: read

env:
  ESP_IDF_VERSION: v5.3.2

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run common-component tests
        run: python3 tests/run_host_tests.py
      - name: Run deployment-tool tests
        run: python3 tests/test_deploy_hardware.py
      - name: Run release-packaging tests
        run: python3 tests/test_package_release.py
      - name: Run WebUI tests
        run: npm test --prefix web-flasher

  build:
    name: Build ${{ matrix.application }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: client
            target: esp32h2
          - application: border-router
            target: esp32c6
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ matrix.target }}
          path: apps/${{ matrix.application }}
      - name: Assemble deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-package/build
          cp -a "apps/${{ matrix.application }}/build/." deploy-package/build/
          cp scripts/deploy_hardware.py deploy-package/deploy_hardware.py
      - name: Package automatic alpha release images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_release.py \
            --tag "v0.0.0-alpha.$GITHUB_RUN_NUMBER" \
            --application "${{ matrix.application }}" \
            --build-directory "apps/${{ matrix.application }}/build" \
            --package-directory release-package
      - name: Upload automatic alpha release package
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware-${{ matrix.application }}
          path: release-package/
          if-no-files-found: error
          retention-days: 1
      - name: Upload firmware build
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.application }}-${{ matrix.target }}
          path: deploy-package/
          if-no-files-found: error
          retention-days: 14

  publish-alpha:
    name: Publish automatic alpha release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - host-tests
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-firmware-*
          path: release-assets
          merge-multiple: true
      - name: Create or update alpha pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.0-alpha.${{ github.run_number }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Automated alpha firmware $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Automated alpha firmware $RELEASE_TAG" \
              --notes "Firmware automatically built from main."
          fi
      - name: Combine manifests
        shell: bash
        env:
          RELEASE_TAG: v0.0.0-alpha.${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py \
            --tag "$RELEASE_TAG" \
            --package-directory release-assets \
            --combine
      - name: Upload versioned assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.0-alpha.${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  deploy:
    name: Deploy ${{ inputs.target }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - host-tests
      - build
    timeout-minutes: 10
    runs-on:
      - self-hosted
      - "${{ inputs.target == 'client' && 'ESP32-H2' || 'ESP32-C6' }}"
    environment:
      name: hardware-${{ inputs.target }}
    concurrency:
      group: hardware-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - name: Download selected firmware build
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ inputs.target }}-${{ inputs.target == 'client' && 'esp32h2' || 'esp32c6' }}
          path: deploy-artifact
      - name: Prepare temporary flasher environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$RUNNER_TEMP/lnot-flasher"
          "$RUNNER_TEMP/lnot-flasher/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-input \
            'esptool==4.7.0' \
            'pyserial==3.5'
          printf 'LNOT_FLASHER_PYTHON=%s/bin/python\n' "$RUNNER_TEMP/lnot-flasher" \
            >> "$GITHUB_ENV"
      - name: Verify assigned Espressif device
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t devices < <(
            compgen -G '/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_*' || true
          )
          if (( ${#devices[@]} != 1 )); then
            echo "::error::Expected exactly one Espressif USB JTAG serial device."
            printf '::error::Found: %s\n' "${devices[@]:-none}"
            exit 1
          fi
          test -c "${devices[0]}" || {
            echo "::error::Assigned path is not a character device: ${devices[0]}"
            exit 1
          }
          printf 'LNOT_DEVICE=%s\n' "${devices[0]}" >> "$GITHUB_ENV"
          printf 'Using assigned board: %s -> %s\n' \
            "${devices[0]}" "$(readlink -f "${devices[0]}")"
          "$LNOT_FLASHER_PYTHON" -c \
            'import esptool, serial; print(esptool.__version__, serial.__version__)'
      - name: Verify selected firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-artifact/build/flasher_args.json || {
            echo "::error::The firmware artifact has no build/flasher_args.json."
            exit 1
          }
      - name: Flash and verify selected device
        shell: bash
        run: |
          set -euo pipefail
          "$LNOT_FLASHER_PYTHON" deploy-artifact/deploy_hardware.py \
            --application "${{ inputs.target }}" \
            --port "$LNOT_DEVICE" \
            --before usb_reset \
            --build-directory deploy-artifact/build \
            --timeout-seconds 120
