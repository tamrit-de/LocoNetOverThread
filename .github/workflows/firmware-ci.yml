name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run common-component tests
        run: python3 tests/run_host_tests.py

  build:
    name: Build ${{ matrix.application }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: client
            target: esp32h2
          - application: border-router
            target: esp32c6
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: ${{ matrix.target }}
          path: apps/${{ matrix.application }}
