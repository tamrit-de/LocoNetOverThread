server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com https://github.com https://objects.githubusercontent.com https://release-assets.githubusercontent.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location /github-release-api/ {
        proxy_pass https://api.github.com/repos/tamrit-de/LocoNetOverThread/releases/assets/;
        proxy_set_header Host api.github.com;
        proxy_ssl_server_name on;
        absolute_redirect off;
        proxy_redirect https://release-assets.githubusercontent.com/ /github-release-assets/;
    }

    location /github-release-assets/ {
        proxy_pass https://release-assets.githubusercontent.com/;
        proxy_set_header Host release-assets.githubusercontent.com;
        proxy_ssl_server_name on;
    }

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri/ =404;
    }
}
